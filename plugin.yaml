name: token-logger
version: "2.1.0"
description: "Per-call dual-write token logging for Hermes Agent — plain-text CSV + SQLite for crash-safe durability. Logs cache hit/miss, costs, and latency; self-heals the database from the CSV archives on start and warns when the two disagree. Enable with `hermes plugins enable token-logger`."
author: underdown
requires_env: []
provides_tools:
  - token-summary
provides_hooks:
  - post_api_request
kind: standalone