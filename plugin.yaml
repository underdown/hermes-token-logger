name: token-logger
version: "2.0.0"
description: "Per-call dual-write token logging for Hermes Agent — plain-text CSV + SQLite for crash-safe durability. Logs DeepSeek cache hit/miss, costs, and latency. Enable with `hermes plugins enable token-logger`."
author: underdown
requires_env: []
provides_tools:
  - token-summary
provides_hooks:
  - post_api_request
kind: standalone